[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-ace"
version = "0.1.0"
description = "Reproducible modeling pipeline for the Trace the Ace tutoring outcomes competition"
requires-python = ">=3.12,<3.14"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "scikit-learn==1.8.0",
  "scipy>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
